name: polydim_dashboard
description: HUD Táctico Panóptico para Orquestador POLYDIM-CLA V2
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Gráficas en tiempo real (Energía de Dirichlet)
  fl_chart: ^0.63.0
  # Conexión asíncrona con el Gateway Rust
  web_socket_channel: ^2.4.0
  # Gestión de estado predictible
  flutter_bloc: ^8.1.3
  # UI Premium (Glassmorphism)
  glassmorphism: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
