[package]
name = "polydim_gateway"
version = "2.0.0"
edition = "2021"
authors = ["Aladino (POLYDIM-CLA)"]
description = "Gateway asíncrono y de verificación topológica para Motor V2"

[dependencies]
tokio = { version = "1.32", features = ["full"] }
axum = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ndarray = "0.15"

# FFI para interactuar con Python (Orquestador principal)
[lib]
name = "polydim_gateway"
crate-type = ["cdylib"]

[dependencies.pyo3]
version = "0.19"
features = ["extension-module", "abi3-py38"]
