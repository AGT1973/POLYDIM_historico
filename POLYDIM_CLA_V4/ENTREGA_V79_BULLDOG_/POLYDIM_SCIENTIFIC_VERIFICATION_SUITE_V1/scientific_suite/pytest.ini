[pytest]
addopts = -ra
markers =
    p0: crítico / bloqueante
    p1: alto impacto
    p2: importante pero no bloqueante
    geometry: geometría diferencial
    householder: reflector Householder
    qr: CholeskyQR / ortogonalización
    cayley: Cayley-SMW / Stiefel
    ffi: ABI, layout, aliasing, native dispatch
    pmtp: protocolo binario y seguridad
    reproducibility: reproducibilidad y PRNG
    metamorphic: property-based / relaciones invariantes
