[package]
name = "einsof_rust"
version = "40.0.0"
edition = "2021"
description = "PMTP bus lock-free + HMAC-BLAKE2b + ring buffer. Capa de seguridad POLYDIM EINSOF V40."

[lib]
name = "einsof_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3      = { version = "0.29", features = ["extension-module"] }
blake2    = "0.10"
hmac      = "0.12"
sha2      = "0.10"
rayon     = "1.8"
crossbeam = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
